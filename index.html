<!DOCTYPE html>
<html>
<head>
  <title>Social App</title>

  <style>
    .navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background: white;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}

.logo {
  font-size: 20px;
}

.nav-right {
  color: #555;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: linear-gradient(45deg, #feda75, #d62976, #962fbf);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.comment {
  background: #f8f8f8;
  padding: 6px 10px;
  margin-top: 5px;
  border-radius: 10px;
}

.like-btn {
  border: none;
  background: none;
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.2s;
}

.like-btn:hover {
  transform: scale(1.2);
}
body {
  font-family: Arial;
  background: #fafafa;
  margin: 0;
}

header {
  background: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  border-bottom: 1px solid #ddd;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 10px;
}

.card {
  background: white;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

input {
  width: 95%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 8px 15px;
  background: #0095f6;
  color: white;
  border: none;
  border-radius: 6px;
}

.post-header {
  display: flex;
  align-items: center;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #ccc;
  margin-right: 10px;
}

.comment {
  background: #f1f1f1;
  padding: 5px;
  margin-top: 5px;
  border-radius: 5px;
}
</style>
</head>

<body>

<header>📸 Social App</header>

<div class="container">

  <!-- Register -->
  <div class="card">
    <h3>Register</h3>
    <input id="regUser" placeholder="Username">
    <input id="regEmail" placeholder="Email">
    <input id="regPass" placeholder="Password" type="password">
    <button onclick="register()">Register</button>
  </div>

  <!-- Login -->
  <div class="card">
    <h3>Login</h3>
    <input id="logEmail" placeholder="Email">
    <input id="logPass" placeholder="Password" type="password">
    <button onclick="login()">Login</button>
  </div>

  <!-- Create Post -->
  <div class="card section">
    <h3>Create Post</h3>
    <input id="text" placeholder="What's on your mind?">
    <button onclick="createPost()">Post</button>
  </div>

  <!-- Feed -->
  <div class="section">
    <h3>Feed</h3>
    <div id="feed"></div>
  </div>
  <div class="card">
  <h3>Users</h3>
  <div id="users"></div>
</div>



</div>

<script>
let token = "";
let userId = "";

async function loadUsers() {
    const res = await fetch("http://localhost:5000/auth/users");
    const data = await res.json();

    users.innerHTML = data.map(u => `
        <div class="card">
            <b>${u.username}</b>
            <button onclick="followUser('${u._id}')">
                Follow
            </button>
        </div>
    `).join("");
}

async function followUser(id) {
    await fetch(`http://localhost:5000/auth/follow/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ userId })
    });

    alert("Follow updated");
}

async function addComment(postId) {
    const text = document.getElementById(`c-${postId}`).value;

    await fetch(`http://localhost:5000/posts/${postId}/comment`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            userId,
            text
        })
    });

    loadPosts();
}

// Register
async function register() {
    await fetch("http://localhost:5000/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: regUser.value,
            email: regEmail.value,
            password: regPass.value
        })
    });
    alert("Registered!");
}

// Login
async function login() {
    const res = await fetch("http://localhost:5000/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: logEmail.value,
            password: logPass.value
        })
    });

    const data = await res.json();
    token = data.token;

    const payload = JSON.parse(atob(token.split('.')[1]));
    userId = payload.id;

    alert("Logged in!");
}

// Create Post
async function createPost() {
    if (!userId) {
        alert("Please login first");
        return;
    }

    const res = await fetch("http://localhost:5000/posts", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            userId,
            text: text.value
        })
    });

    const data = await res.json();
    console.log(data); // debug

    text.value = "";
    loadPosts();
}

// Load Posts
async function loadPosts() {
    const res = await fetch("http://localhost:5000/posts");
    const data = await res.json();

    feed.innerHTML = data.map(p => `
        <div class="card">

            <div class="post-header">
                <div class="avatar">${p.userId ? p.userId[0].toUpperCase() : "U"}</div>
                <b>User</b>
            </div>

            <div class="post-text">${p.text}</div>

           <button class="like-btn" onclick="likePost('${p._id}')">
                ❤️ ${(p.likes || []).length}
            </button>

            <br><br>

            <input id="c-${p._id}" placeholder="Write comment">
            <button onclick="addComment('${p._id}')">Comment</button>

            <div>
                ${(p.comments || []).map(c => `
                    <div class="comment">${c.text}</div>
                `).join("")}
            </div>

        </div>
    `).join("");
}
// Like Post
async function likePost(id) {
    await fetch(`http://localhost:5000/posts/${id}/like`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ userId })
    });

    loadPosts();
}

loadPosts();
</script>
<div class="card">
  <h3>Users</h3>
  <div id="users"></div>
</div>c

</body>
</html>
